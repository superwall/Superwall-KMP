name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (common + Android + host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default also installs the legacy `tools` package, which
        # Google has dropped from the SDK repository, so sdkmanager exits 1.
        with:
          packages: 'platform-tools'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compile common metadata
        run: ./gradlew :superwall-kmp:compileCommonMainKotlinMetadata

      - name: Build (Android compile + host tests)
        run: ./gradlew :superwall-kmp:build

  macos:
    name: macOS (bridge + iOS targets)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # SuperwallKit requires a Swift 6 toolchain (strict-concurrency patterns
      # that fail under Xcode 15.x); mirror Superwall-iOS's own CI.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            bridge/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('bridge/Package.swift', 'bridge/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build bridge XCFramework
        run: |
          if [ -f bridge/Package.swift ]; then
            bash bridge/scripts/build-xcframework.sh
          else
            echo "bridge/Package.swift not present yet (lands with Phase 1) - skipping"
          fi

      # `swift test` builds for macOS, where the iOS-only SuperwallKit (UIKit)
      # cannot compile — bridge tests must run on an iOS Simulator.
      - name: Run bridge tests (iOS Simulator)
        working-directory: bridge
        run: |
          if [ -f Package.swift ]; then
            DEVICE="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9a-zA-Z ]+' | head -1 | sed 's/ *$//')"
            echo "Using simulator: ${DEVICE}"
            xcodebuild test \
              -workspace . \
              -scheme SuperwallKMPBridge \
              -destination "platform=iOS Simulator,name=${DEVICE}" \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "bridge/Package.swift not present yet (lands with Phase 1) - skipping"
          fi

      # Ground truth for cinterop debugging: the generated ObjC header defines
      # exactly what Kotlin sees. Dumped to the log so binding mismatches can
      # be diagnosed without a macOS machine.
      - name: Dump generated bridge header
        run: |
          H="$(find bridge/build -name 'SuperwallKMPBridge-Swift.h' -print -quit)"
          if [ -n "$H" ]; then
            echo "=== ${H} ==="
            cat "$H"
          else
            echo "no generated header found under bridge/build"
          fi

      # cinterop wiring against the bridge XCFramework lands with the iosMain phase;
      # until then these tasks compile stub actuals only.
      - name: Compile iOS targets
        continue-on-error: false
        run: |
          ./gradlew \
            :superwall-kmp:compileKotlinIosArm64 \
            :superwall-kmp:compileKotlinIosX64 \
            :superwall-kmp:compileKotlinIosSimulatorArm64

      - name: Run iOS simulator tests
        continue-on-error: false
        run: ./gradlew :superwall-kmp:iosSimulatorArm64Test

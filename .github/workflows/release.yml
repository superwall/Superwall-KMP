# Release pipeline, mirroring Superwall-Android's "build+test+deploy.yml".
#
# Same shape as Android: push to main, resolve the version from version.env via
# `generateBuildInfo`, publish if that version has not been tagged yet, then tag,
# cut a release branch, pull the release notes out of CHANGELOG.md, create the
# GitHub release and notify Slack.
#
# Two differences, both forced by the iOS half of this SDK:
#   * It runs on macOS. Publishing a KMP module with iOS targets has to compile
#     the iOS klibs, and the cinterop step needs the bridge XCFramework present —
#     this is a hard requirement, not an optimisation (see .agents/AGENTS.md).
#   * It builds and tests bridge/ first, then ships SuperwallKMPBridge.xcframework.zip
#     plus its checksum as release assets. The klib and the exact bridge build it
#     was compiled against are one release unit.
name: Build, Test & Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# Prevents running a bunch if we push right back to back
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SuperwallKit requires a Swift 6 toolchain (strict-concurrency patterns
      # that fail under Xcode 15.x); mirror Superwall-iOS's own CI.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build bridge XCFramework
        run: bash bridge/scripts/build-xcframework.sh

      # `swift test` builds for macOS, where the iOS-only SuperwallKit (UIKit)
      # cannot compile — bridge tests must run on an iOS Simulator.
      # Same invocation as ci.yml: `-workspace .` on the package directory, with
      # the simulator discovered at runtime so the runner image's device list can
      # change without breaking the release.
      - name: Run bridge tests (iOS Simulator)
        working-directory: bridge
        run: |
          DEVICE="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9a-zA-Z ]+' | head -1 | sed 's/ *$//')"
          echo "Using simulator: ${DEVICE}"
          xcodebuild test \
            -workspace . \
            -scheme SuperwallKMPBridge \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            CODE_SIGNING_ALLOWED=NO

      # Writes superwall-kmp/build/version.json from the version resolved in the
      # root build.gradle.kts (SUPERWALL_VERSION env var, else version.env).
      #
      # --no-configuration-cache is deliberate: version.env is read with plain
      # file I/O at CONFIGURATION time, which the configuration cache does not
      # track as an input. A cache entry restored by setup-gradle would happily
      # report the previous version — i.e. tag and publish the wrong one.
      - name: Generate version from config
        run: ./gradlew :superwall-kmp:generateBuildInfo --no-configuration-cache

      - name: Get Version
        uses: notiz-dev/github-action-json-property@release
        id: version
        with:
          path: "superwall-kmp/build/version.json"
          prop_path: "version"

      # Only try to publish if we're on main
      - name: Check if tag exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: check-tag
        run: |
          EXISTS=$(git tag -l | grep -Fxq "${{ steps.version.outputs.prop }}" && echo 'true' || echo 'false')
          echo "tag-exists=$EXISTS" >> "$GITHUB_OUTPUT"

      # Checked separately from the tag so a partially failed run self-heals:
      # if the tag was pushed but the release creation failed, the next push
      # to main still creates the missing release.
      - name: Check if release exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: check-release
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.prop }}")
          if [ "$STATUS" = "200" ]; then
            echo "release-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip and checksum XCFramework
        id: xcframework
        run: |
          cd bridge/build
          zip -r -y SuperwallKMPBridge.xcframework.zip SuperwallKMPBridge.xcframework
          CHECKSUM="$(swift package compute-checksum SuperwallKMPBridge.xcframework.zip)"
          echo "$CHECKSUM" > SuperwallKMPBridge.xcframework.zip.checksum
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Computed checksum: $CHECKSUM"

      # Point the CONSUMER-facing manifest at the artifact this run just built.
      #
      # Why this has to happen here, before the Tag step: SPM resolves a
      # package's manifest AT THE GIT TAG, so the tag must already contain the
      # real url + checksum — but the checksum only exists once the XCFramework
      # has been built and zipped. Hence: build → zip → checksum → rewrite →
      # commit → tag that commit → upload the asset to that tag.
      #
      # The URL uses the bare version, matching the tag format the Tag step
      # creates (0.1.0, not v0.1.0) — the placeholder in Package.swift carries a
      # `v` prefix that no tag ever uses.
      #
      # [skip ci] on the commit stops this push to main from re-triggering the
      # workflow.
      - name: Point Package.swift at the release artifact
        if: steps.check-tag.outputs.tag-exists == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.prop }}
          CHECKSUM: ${{ steps.xcframework.outputs.checksum }}
        run: |
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/SuperwallKMPBridge.xcframework.zip"
          # Anchored on the keys rather than the placeholder values, so this is
          # idempotent: it rewrites whatever the previous release left behind.
          sed -i '' -E \
            -e "s#url: \".*/SuperwallKMPBridge\.xcframework\.zip\"#url: \"${ASSET_URL}\"#" \
            -e "s#checksum: \"[a-fA-F0-9]*\"#checksum: \"${CHECKSUM}\"#" \
            Package.swift
          echo "--- binaryTarget after rewrite ---"
          grep -A2 'binaryTarget' Package.swift
          # Fail loudly rather than shipping a manifest that still points at
          # nothing. Scoped to the url/checksum LINES — the surrounding comment
          # legitimately contains the word "placeholder".
          if grep -E '^[[:space:]]*(url|checksum): ' Package.swift | grep -q 'PLACEHOLDER\|"0\{64\}"'; then
            echo "::error::Package.swift still contains placeholder values after rewrite"
            exit 1
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Package.swift
          git commit -m "chore(release): point Package.swift at ${VERSION} artifact [skip ci]"
          git push origin HEAD:main

      # mavenCentralAutomaticPublishing releases the deployment in the Central
      # Portal automatically, so no manual "Publish" click is needed.
      #
      # Requires these repository secrets (same names as Superwall-Android):
      #   ORG_GRADLE_PROJECT_mavenCentralUsername
      #   ORG_GRADLE_PROJECT_mavenCentralPassword
      #   ORG_GRADLE_PROJECT_signingInMemoryKey
      #   ORG_GRADLE_PROJECT_signingInMemoryKeyId
      #   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
      - name: Deploy
        if: steps.check-tag.outputs.tag-exists == 'false'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
        run: ./gradlew :superwall-kmp:publish --no-configuration-cache -PmavenCentralAutomaticPublishing=true

      - name: Determine prerelease status
        id: prerelease
        run: |
          VERSION=${{ steps.version.outputs.prop }}
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
            echo "status=true" >> "$GITHUB_OUTPUT"
          else
            echo "status=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.check-tag.outputs.tag-exists }}" == "false" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git pull
            git tag -a ${{ steps.version.outputs.prop }} -m "tags with latest version"
            git push --tags
            git checkout -b release/${{ steps.version.outputs.prop }}
            git push -u origin release/${{ steps.version.outputs.prop }}
          fi

      # Pull the "## <version>" section out of CHANGELOG.md to use as the
      # release description. Version headings look like "## 0.1.0"; the
      # section ends at the next version heading (or "## Unreleased").
      - name: Extract release notes from changelog
        if: steps.check-release.outputs.release-exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.prop }}"
          awk -v ver="$VERSION" '
            /^## / && $2 == ver { found = 1; next }
            found && /^## / && ($2 ~ /^[0-9]+\./ || $2 == "Unreleased") { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Trim leading blank lines
          sed -i '' -e '/./,$!d' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry found for $VERSION, falling back to a link."
            echo "See the [CHANGELOG](https://github.com/superwall/Superwall-KMP/blob/main/CHANGELOG.md) for details." > release-notes.md
          fi
          echo "Release notes for $VERSION:"
          cat release-notes.md

      - name: Create GitHub release
        if: steps.check-release.outputs.release-exists == 'false'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.prop }}
          name: ${{ steps.version.outputs.prop }}
          body_path: release-notes.md
          prerelease: ${{ steps.prerelease.outputs.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            bridge/build/SuperwallKMPBridge.xcframework.zip
            bridge/build/SuperwallKMPBridge.xcframework.zip.checksum

      - name: slack-send
        # Only notify on a new release.
        #
        # continue-on-error: notification is not part of the release. By this
        # point the artifacts are published, tagged and released — a missing or
        # rotated SLACK_WEBHOOK must not turn a successful release red.
        if: steps.check-release.outputs.release-exists == 'false'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "KMP SDK ${{ steps.version.outputs.prop }} was published to Maven Central and released: ${{ steps.release.outputs.url }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

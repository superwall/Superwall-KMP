name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Release (bridge XCFramework + Maven Central)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build bridge XCFramework
        run: bash bridge/scripts/build-xcframework.sh

      - name: Run bridge tests
        working-directory: bridge
        run: swift test

      - name: Zip and checksum XCFramework
        run: |
          cd bridge/build
          zip -r -y SuperwallKMPBridge.xcframework.zip SuperwallKMPBridge.xcframework
          swift package compute-checksum SuperwallKMPBridge.xcframework.zip | tee SuperwallKMPBridge.xcframework.zip.checksum

      - name: Attach XCFramework to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bridge/build/SuperwallKMPBridge.xcframework.zip
            bridge/build/SuperwallKMPBridge.xcframework.zip.checksum

      # TODO: update repo-root Package.swift binary-target URL/checksum (+ podspec)
      # and commit, per docs/IMPLEMENTATION_PLAN.md section 8 (Release).

      - name: Publish to Maven Central
        # TODO: configure the following repository secrets before enabling this step for real:
        #   ORG_GRADLE_PROJECT_mavenCentralUsername  -> secrets.MAVEN_CENTRAL_USERNAME
        #   ORG_GRADLE_PROJECT_mavenCentralPassword  -> secrets.MAVEN_CENTRAL_PASSWORD
        #   ORG_GRADLE_PROJECT_signingInMemoryKey            -> secrets.SIGNING_IN_MEMORY_KEY
        #   ORG_GRADLE_PROJECT_signingInMemoryKeyId          -> secrets.SIGNING_IN_MEMORY_KEY_ID
        #   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword    -> secrets.SIGNING_IN_MEMORY_KEY_PASSWORD
        # env:
        #   ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        #   ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        #   ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        #   ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
        #   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          echo "TODO: enable './gradlew publishToMavenCentral --no-configuration-cache' once secrets are configured"

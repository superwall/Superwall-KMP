# Bumps the wrapped native SDK when Superwall-Android or Superwall-iOS releases.
#
# Fired by the native repos' notify-wrappers.yml (repository_dispatch
# `native-sdk-release`, payload {platform, version}), or by hand.
#
# Two stages, so a PR always exists even if the agent fails or finds nothing:
#   1. Deterministic bump: native pin, version.env, CHANGELOG — committed and
#      opened as a PR.
#   2. Pi agent (shaftoe/pi-coding-agent-action) reads the native release notes
#      for the whole skipped range and, if the public API changed, implements
#      the wrapper side and pushes it onto the same PR.
#
# Secrets:
#   ANTHROPIC_API_KEY  — for the agent.
#   SDK_BOT_TOKEN      — optional but recommended: PAT/App token with contents +
#                        pull-requests write here. Pushes and PRs made with
#                        GITHUB_TOKEN do not trigger ci.yml, so without it the
#                        bump PR gets no CI. If unset, GITHUB_TOKEN is used and
#                        "Allow GitHub Actions to create and approve pull
#                        requests" must be enabled in the repo settings.
# Variables:
#   PI_MODEL           — optional model override.
#
# Testing: run it by hand with dry_run: true — it applies the bump and prints
# the diff and the agent prompt, but pushes nothing, opens no PR and skips the
# agent. Locally, local-ci (https://agent-ci.dev) can run it through a caller
# workflow that uses this one via workflow_call with dry_run: true.
name: Native SDK bump

on:
  repository_dispatch:
    types: [native-sdk-release]
  workflow_dispatch:
    inputs:
      platform:
        description: Native SDK that released
        required: true
        type: choice
        options: [android, ios]
      version:
        description: Native version (blank = latest release)
        required: false
        type: string
      dry_run:
        description: Apply the bump and print the diff and agent prompt only — no push, PR or agent
        required: false
        type: boolean
        default: false
  # Same inputs for callers. Mainly so the workflow can be run locally with
  # local-ci (https://agent-ci.dev), which cannot simulate dispatch events but
  # does pass workflow_call inputs.
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      version:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

# One bump per platform at a time; an Android and an iOS bump may run together.
concurrency:
  group: native-sdk-bump-${{ github.event.client_payload.platform || inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  BASE_BRANCH: main

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.SDK_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      # Values flow between steps through $GITHUB_ENV rather than step
      # outputs: same behaviour on GitHub, and it also works under local-ci,
      # which resolves steps.*.outputs.* to empty strings.
      - name: Resolve target
        env:
          PLATFORM: ${{ github.event.client_payload.platform || inputs.platform }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          case "$PLATFORM" in
            android) REPO=superwall/Superwall-Android; LABEL=Android ;;
            ios)     REPO=superwall/Superwall-iOS;     LABEL=iOS ;;
            *) echo "::error::Unknown platform '$PLATFORM'"; exit 1 ;;
          esac
          if [ -z "$VERSION" ]; then
            VERSION="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
          fi
          VERSION="${VERSION#v}"
          # The payload is interpolated into commands and the agent prompt, so
          # accept nothing but a stable x.y.z.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a stable x.y.z version"; exit 1
          fi
          {
            echo "PLATFORM=$PLATFORM"
            echo "REPO=$REPO"
            echo "LABEL=$LABEL"
            echo "VERSION=$VERSION"
            echo "BRANCH=native-sdk/$PLATFORM-$VERSION"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.SDK_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read current pin
        run: |
          if [ "$PLATFORM" = android ]; then
            CURRENT="$(sed -nE 's/^superwall-android = "([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          else
            CURRENT="$(sed -nE 's/.*Superwall-iOS", exact: "([^"]+)".*/\1/p' bridge/Package.swift)"
          fi
          [ -n "$CURRENT" ] || { echo "::error::Could not read the current $PLATFORM pin"; exit 1; }
          echo "CURRENT=$CURRENT" >> "$GITHUB_ENV"

          SKIP=false
          if [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" = "$CURRENT" ]; then
            echo "::notice::$PLATFORM is already at $CURRENT (>= $VERSION), nothing to do."
            SKIP=true
          # Through the API rather than `git ls-remote`, which local-ci stubs to
          # always succeed.
          elif gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" 2>/dev/null; then
            echo "::notice::Branch $BRANCH already exists, a bump PR was already opened."
            SKIP=true
          fi
          echo "SKIP=$SKIP" >> "$GITHUB_ENV"

      - name: Fetch native source and release notes
        if: env.SKIP == 'false'
        run: |
          # Inside the workspace so the agent can read it, but excluded from git
          # so the agent's commits never pick it up.
          git clone --quiet --filter=blob:none "https://github.com/$REPO" .native-sdk
          git -C .native-sdk checkout --quiet "$VERSION" 2>/dev/null \
            || git -C .native-sdk checkout --quiet "v$VERSION"
          echo ".native-sdk/" >> .git/info/exclude
          python3 .github/scripts/native-changelog.py .native-sdk/CHANGELOG.md "$CURRENT" "$VERSION" \
            > "$RUNNER_TEMP/native-changelog.md"
          [ -s "$RUNNER_TEMP/native-changelog.md" ] \
            || echo "_No CHANGELOG.md entries found between $CURRENT and $VERSION._" > "$RUNNER_TEMP/native-changelog.md"
          cat "$RUNNER_TEMP/native-changelog.md"

      - name: Apply version bump
        if: env.SKIP == 'false'
        run: |
          if [ "$PLATFORM" = android ]; then
            sed -i -E "s/^(superwall-android = \")[^\"]+\"/\1$VERSION\"/" gradle/libs.versions.toml
          else
            # Only the SuperwallKit pin. Package.swift's url/checksum belong to
            # the release workflow and must not be touched.
            sed -i -E "s#(Superwall-iOS\", exact: \")[^\"]+\"#\1$VERSION\"#" Package.swift bridge/Package.swift
          fi

          # Bump the patch version unless a release is already staged
          # (version.env ahead of the newest tag) — then this joins it.
          KMP_VERSION="$(sed -nE 's/^SUPERWALL_VERSION=(.*)$/\1/p' version.env)"
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$KMP_VERSION" 2>/dev/null; then
            IFS=. read -r MA MI PA <<< "$KMP_VERSION"
            KMP_VERSION="$MA.$MI.$((PA + 1))"
            sed -i -E "s/^SUPERWALL_VERSION=.*/SUPERWALL_VERSION=$KMP_VERSION/" version.env
          fi
          echo "KMP_VERSION=$KMP_VERSION" >> "$GITHUB_ENV"

          python3 .github/scripts/changelog-entry.py CHANGELOG.md "$KMP_VERSION" "## Enhancements" \
            "Updates $LABEL SDK to $VERSION [View $LABEL SDK release notes](https://github.com/$REPO/releases/tag/$VERSION)." \
            "Updates $LABEL SDK to"
          git -c core.fileMode=false --no-pager diff

      - name: Open PR
        if: env.SKIP == 'false' && env.DRY_RUN == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -am "Bump $LABEL SDK to $VERSION"
          git push -u origin "$BRANCH"

          {
            echo "Bumps the $LABEL SDK from \`$CURRENT\` to \`$VERSION\` and Superwall-KMP to \`$KMP_VERSION\`."
            echo
            echo "Opened automatically by \`native-sdk-bump.yml\` after [$REPO $VERSION](https://github.com/$REPO/releases/tag/$VERSION) was released. An agent then checks the release notes below for public API changes and pushes any integration work onto this PR."
            echo
            echo "<details><summary>$LABEL release notes ($CURRENT → $VERSION)</summary>"
            echo
            cat "$RUNNER_TEMP/native-changelog.md"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "Bump $LABEL SDK to $VERSION" --body-file "$RUNNER_TEMP/pr-body.md"
          echo "PR=$(gh pr view "$BRANCH" --json number -q .number)" >> "$GITHUB_ENV"

      # Toolchain for the agent to validate its changes with.
      - uses: actions/setup-node@v4
        if: env.SKIP == 'false' && env.DRY_RUN == 'false'
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        if: env.SKIP == 'false' && env.DRY_RUN == 'false'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP == 'false' && env.DRY_RUN == 'false'

      - name: Build agent prompt
        if: env.SKIP == 'false'
        run: |
          if [ "$PLATFORM" = android ]; then
            PLATFORM_NOTES="Android work lives in superwall-kmp/src/androidMain (AndroidSuperwallBridge, mappers/, adapters/). gradle/libs.versions.toml also holds compileOnly pins that must match superwall-android's own dependency versions (see the comment there); check .native-sdk's build files and update them if they moved. Validate with: ./gradlew :superwall-kmp:compileAndroidMain :superwall-kmp:testAndroidHostTest (pick the matching task names from ./gradlew :superwall-kmp:tasks if these differ)."
          else
            PLATFORM_NOTES="iOS work goes through the @objc Swift facade in bridge/Sources/SuperwallKMPBridge and is consumed from superwall-kmp/src/iosMain via cinterop. This runner is Linux: Swift and iOS targets cannot be built here, so be careful and precise with Swift and say in the PR description that iOS was not compiled locally. Package.swift's url/checksum lines are owned by the release workflow — never edit them. Validate what can be validated with ./gradlew :superwall-kmp:compileAndroidMain (common code)."
          fi
          DELIM="PROMPT_$(openssl rand -hex 8)"
          {
            echo "AGENT_PROMPT<<$DELIM"
            cat <<EOF
          You are integrating a native Superwall SDK release into Superwall-KMP, the Kotlin Multiplatform wrapper over Superwall-Android and Superwall-iOS.

          $REPO was bumped from $CURRENT to $VERSION. That mechanical bump (native pin, version.env = $KMP_VERSION, CHANGELOG entry) is already committed on PR #$PR (branch $BRANCH), which is checked out. Do not undo it.

          The native SDK source is at .native-sdk/, checked out at tag $VERSION with full history. Use \`git -C .native-sdk diff $CURRENT $VERSION -- <paths>\` to see exactly how its public API changed. Do not modify anything under .native-sdk/.

          Native release notes for every version in the range:

          $(cat "$RUNNER_TEMP/native-changelog.md")

          Your job:
          1. Read .claude/CLAUDE.md and .agents/AGENTS.md first and follow their conventions (public API in commonMain only, explicitApi, no platform types in public signatures, main-thread callbacks).
          2. Decide whether Superwall-KMP needs changes beyond the version bump. Work is needed for: new public methods, properties or options; changed signatures; new or renamed delegate callbacks, events or enum cases that the wrapper maps; deprecated or removed APIs the wrapper calls; behaviour changes the wrapper or its docs describe. Internal fixes and performance work need nothing.
          3. If work is needed, implement it end to end: common API, the $LABEL implementation, and a sensible behaviour on the other platform when the feature is $LABEL-only (document it as such). Add or update tests next to the existing ones. $PLATFORM_NOTES
          4. Update comments and docs (README.md, docs/, sample/) that state the pinned $LABEL version $CURRENT so they say $VERSION — only where they describe the current pin, not historical notes.
          5. Add customer-facing bullets for anything you add to the "## $KMP_VERSION" section of CHANGELOG.md.
          6. Never commit code that does not compile. If part of the work cannot be done safely, leave it out and list it in the PR description as follow-up.
          7. Push with the update_pull_request tool for PR #$PR — never create_pull_request, never push to $BASE_BRANCH, never edit .github/. Update the PR description: keep the existing text and release notes, and add an "Integration changes" section listing what you changed and why. If nothing beyond the bump is needed, change no files and only add that section explaining why no integration work is needed.
          EOF
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Dry-run summary
        if: env.SKIP == 'false' && env.DRY_RUN == 'true'
        run: |
          echo "::notice::Dry run: nothing was pushed, no PR was opened, the agent did not run."
          git -c core.fileMode=false --no-pager diff HEAD
          echo "----- agent prompt -----"
          printf '%s\n' "$AGENT_PROMPT"

      - name: Integrate with Pi
        if: env.SKIP == 'false' && env.DRY_RUN == 'false'
        id: pi
        continue-on-error: true
        uses: shaftoe/pi-coding-agent-action@v2.29.1
        with:
          github_token: ${{ secrets.SDK_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          provider: anthropic
          model: ${{ vars.PI_MODEL || 'claude-opus-5-5' }}
          token: ${{ secrets.ANTHROPIC_API_KEY }}
          thinking_level: high
          auto_compaction: true
          pr_number: ${{ env.PR }}
          prompt: ${{ env.AGENT_PROMPT }}

      # The bump PR stands on its own; make it obvious that nobody reviewed the
      # release notes for API changes.
      - name: Flag failed integration
        if: env.SKIP == 'false' && env.DRY_RUN == 'false' && steps.pi.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --body "The integration agent failed ([run]($RUN_URL)). This PR only contains the version bump — check the release notes above for public API changes by hand before merging."

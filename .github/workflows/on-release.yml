# Mirrors Superwall-Android's on-release.yml: tells paywall-next that a new SDK
# release exists. Same action and pin; only the event-type differs.
name: Notify KMP release

on:
  release:
    types: [created]

jobs:
  notify_pwn:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@98b1133981c5060126325c279a8840c1711a9fe0
        with:
          token: ${{ secrets.MAIN_REPO_PAT }}
          repository: superwall/paywall-next
          event-type: kmp-release

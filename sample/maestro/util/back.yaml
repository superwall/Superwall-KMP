appId: ${APP_ID}
---
# Pop one APP screen. For dismissing a paywall use dismiss_paywall.yaml instead.
#
# The KMP sample navigates by in-app state (sample/shared/.../App.kt) and renders
# a "Back" TextButton in the TopAppBar on every non-Home screen, on BOTH
# platforms, so one tap is all this needs. It installs no BackHandler, so
# Android's hardware back would exit the app rather than pop.
#
# This deliberately does NOT also fall back to hardware back when "Back" is
# absent. It used to, and the two branches are evaluated in sequence: after the
# tap succeeded, "Back" was gone, the fallback's condition became true, and
# Android pressed hardware back as well — leaving the app.
- tapOn: "Back"

[versions]
agp = "9.0.1"
kotlin = "2.3.10"
android-minSdk = "26"
android-compileSdk = "36"
vanniktechMavenPublish = "0.36.0"
kotlinx-coroutines = "1.10.2"
superwall-android = "2.8.0"
androidx-startup = "1.2.0"
# Compile-only pins matching superwall-android 2.8.0's own (runtime-scoped) deps:
android-billing = "9.1.0"
kotlinx-serialization = "1.7.2"
# Sample app only (not used by the published :superwall-kmp module):
# Compose Multiplatform 1.11.1 — latest stable on Maven Central; requires KGP >= 2.2.0
# (verified in the plugin's own check) and its runtime klibs are built with Kotlin 2.2.20,
# which the Kotlin 2.3.10 compiler consumes fine (newer compilers read older klibs).
# The Compose *compiler* comes from org.jetbrains.kotlin.plugin.compose at the Kotlin version.
composeMultiplatform = "1.11.1"
androidx-activityCompose = "1.12.4"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
superwall-android = { module = "com.superwall.sdk:superwall-android", version.ref = "superwall-android" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
android-billing = { module = "com.android.billingclient:billing", version.ref = "android-billing" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
